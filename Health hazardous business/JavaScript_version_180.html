<script>
let currentEditingRowIndex = null;
let currentUser = { username: "", realName: "", position: "" };
let loadedQuestions = [];

window.addEventListener('DOMContentLoaded', () => {
  if (typeof initSetupFormData === 'function') { initSetupFormData(); } 
  else { loadInitialSetupData(); }
  setupAutoClearZero(); 
});

function setupAutoClearZero() {
  const targets = ['#animal_count', '#machine_count', '#machine_power', '#worker_male', '#worker_female'];
  targets.forEach(selector => {
    const input = document.querySelector(selector);
    if (!input) return;
    input.addEventListener('focus', function() { if (this.value === '0') this.value = ''; });
    input.addEventListener('blur', function() {
      if (this.value.trim() === '') {
        this.value = '0';
        if (this.id === 'worker_male' || this.id === 'worker_female') {
          if (typeof calcTotalWorkers === 'function') calcTotalWorkers();
        }
      }
    });
  });
}

function addMaterialRow() {
  const tbody = document.getElementById('materialsTableBody');
  if (!tbody) return;
  const rowCount = tbody.children.length + 1;
  const tr = document.createElement('tr');
  tr.className = "material-row";
  tr.innerHTML = `
    <td class="p-2 text-center text-slate-400 font-bold row-index">${rowCount}</td>
    <td class="p-1"><input type="text" class="table-input mat-name" placeholder="ชื่อวัตถุดิบหรือสารเคมี..."></td>
    <td class="p-1"><input type="text" class="table-input mat-qty" placeholder="เช่น 500 กก./ปี..."></td>
    <td class="p-1 text-center"><button type="button" onclick="this.closest('tr').remove(); reindexMaterials();" class="text-rose-500 font-bold hover:text-rose-700 cursor-pointer">✕</button></td>
  `;
  tbody.appendChild(tr);
}

function reindexMaterials() {
  document.querySelectorAll('.material-row').forEach((row, index) => {
    let indexCell = row.querySelector('.row-index');
    if (indexCell) indexCell.innerText = index + 1;
  });
}

function loadInitialSetupData() {
  google.script.run.withSuccessHandler((data) => { loadedQuestions = data.questions; }).getFormSetupData();
}

function showCustomModal(title, message, icon) {
  const mTitle = document.getElementById('modalTitle');
  const mMsg = document.getElementById('modalMessage');
  const mIcon = document.getElementById('modalIcon');
  const modal = document.getElementById('customModal');
  if (mTitle) mTitle.innerText = title;
  if (mMsg) mMsg.innerText = message;
  if (mIcon) mIcon.innerText = icon;
  if (modal) modal.classList.remove('hidden');
}

function closeCustomModal() {
  document.getElementById('customModal').classList.add('hidden');
}

function submitLogin() {
  const username = document.getElementById('login_username').value.trim();
  const password = document.getElementById('login_password').value.trim();
  const msg = document.getElementById('login_msg');
  if (!username || !password) { msg.innerText = "กรุณากรอก Username และ Password"; return; }

  google.script.run.withSuccessHandler(function(res) {
    if (!res || !res.success) { msg.innerText = res && res.msg ? res.msg : "เข้าสู่ระบบไม่สำเร็จ"; return; }
    currentUser.username = username;
    currentUser.realName = res.name || "";
    currentUser.position = res.position || "";
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('inspector_name').value = currentUser.realName;
    document.getElementById('inspector_position').value = currentUser.position;
  }).checkLogin(username, password);
}

function initSetupFormData() {
  google.script.run.withSuccessHandler(function(res) {
    let bTypeContainer = document.getElementById('businessTypeContainer');
    if (bTypeContainer && res.types) {
      bTypeContainer.innerHTML = res.types.map(t => `
        <label class="flex items-start gap-2 mb-1 cursor-pointer hover:bg-slate-50 p-1.5 rounded transition-colors border-b border-slate-100 last:border-0">
          <input type="checkbox" class="mt-1 bus-type-cb accent-blue-600 w-4 h-4" value="${t}" onchange="updateBusinessType()">
          <span class="leading-snug text-[13px]">${t}</span>
        </label>
      `).join('');
    }
    let bStyleSelect = document.getElementById('buildingStyle');
    if (bStyleSelect && res.buildingStyles) bStyleSelect.innerHTML = res.buildingStyles.map(s => `<option value="${s}">${s}</option>`).join('');
    let shopList = document.getElementById('shopNameList');
    if (shopList && res.shops) shopList.innerHTML = res.shops.map(s => `<option value="${s}">`).join('');
    
    let qBody = document.getElementById('questionsTableBody');
    if (res.questions && res.questions.length > 0) {
      window.loadedQuestions = res.questions;
      let qHtml = '';
      res.questions.forEach(function(q, index) {
        let dbNum = index + 1;    
        let displayNum = q.num.toString().trim();
        let isMainHeader = (displayNum === '8');

        let evaluationOptions = isMainHeader ? 
          `<span class="text-[11px] text-slate-400 font-bold bg-slate-100 px-2 py-1 rounded">กรุณาประเมินในข้อย่อย</span><input type="hidden" name="r${dbNum}" value="ไม่เกี่ยวข้อง">` 
          : 
          `<div class="flex items-center justify-center gap-1.5">
            <label class="flex items-center space-x-1 cursor-pointer font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-md border border-emerald-200 text-[11px]">
              <input type="radio" name="r${dbNum}" value="ใช่" class="w-3 h-3 accent-emerald-600"> <span>ใช่</span>
            </label>
            <label class="flex items-center space-x-1 cursor-pointer font-semibold text-rose-700 bg-rose-50 px-2 py-1 rounded-md border border-rose-200 text-[11px]">
              <input type="radio" name="r${dbNum}" value="ไม่ใช่" class="w-3 h-3 accent-rose-600"> <span>ไม่ใช่</span>
            </label>
            <label class="flex items-center space-x-1 cursor-pointer font-semibold text-slate-600 bg-slate-100 px-2 py-1 rounded-md border border-slate-300 text-[11px]">
              <input type="radio" name="r${dbNum}" value="ไม่เกี่ยวข้อง" class="w-3 h-3 accent-slate-600" > <span>N/A</span>
            </label>
          </div>`;

        qHtml += `
          <tr class="${isMainHeader ? 'bg-amber-50/30' : 'hover:bg-slate-50/50'} transition-all">
            <td class="p-3 text-center font-bold text-slate-600 ${isMainHeader ? '' : 'bg-slate-50/30'}">${displayNum === '-' ? '' : 'ข้อ ' + displayNum}</td>
            <td class="p-3 ${isMainHeader ? 'font-bold text-slate-900' : 'font-medium text-slate-700'} leading-relaxed">${q.text}</td>
            <td class="p-3 text-center">${evaluationOptions}</td>
            <td class="p-2"><input type="text" id="f${dbNum}" name="f${dbNum}" placeholder="พบอะไรหน้างาน..." class="table-input" ${isMainHeader ? 'disabled' : ''}></td>
            <td class="p-2"><input type="text" id="c${dbNum}" name="c${dbNum}" placeholder="สั่งปรับปรุงอะไร..." class="table-input" ${isMainHeader ? 'disabled' : ''}></td>
          </tr>
        `;
      });
      qBody.innerHTML = qHtml;
    } else {
      qBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-500 font-bold">⚠️ ไม่พบฐานข้อมูลข้อคำถามประเมิน</td></tr>`;
    }
  }).getFormSetupData();
}

function changeMenuToggle(view) {
  const btnAssess = document.getElementById('btn-menu-assess');
  const btnDash = document.getElementById('btn-menu-dash');
  const viewAssess = document.getElementById('view-assessment');
  const viewDashboard = document.getElementById('view-dashboard');

  if (view === 'assessment') {
    viewAssess.classList.remove('hidden'); viewDashboard.classList.add('hidden');
    btnAssess.className = "bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm cursor-pointer transition-all";
    btnDash.className = "hover:text-white text-slate-400 px-4 py-2 rounded-lg text-xs font-bold cursor-pointer transition-all";
  } else {
    viewAssess.classList.add('hidden'); viewDashboard.classList.remove('hidden');
    btnDash.className = "bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm cursor-pointer transition-all";
    btnAssess.className = "hover:text-white text-slate-400 px-4 py-2 rounded-lg text-xs font-bold cursor-pointer transition-all";
    loadLicenseData();
  }
}

function autoCalcExpireDate() {
  const startDateInput = document.getElementById('app_start_date').value;
  if (!startDateInput) return;
  let startDate = new Date(startDateInput);
  startDate.setFullYear(startDate.getFullYear() + 1); startDate.setDate(startDate.getDate() - 1);
  let yyyy = startDate.getFullYear();
  let mm = String(startDate.getMonth() + 1).padStart(2, '0');
  let dd = String(startDate.getDate()).padStart(2, '0');
  document.getElementById('app_end_date').value = `${yyyy}-${mm}-${dd}`;
}

function renderDashboardTable(lists) {
  const tbody = document.getElementById('licenseTableBody');
  const yearSelect = document.getElementById('statYearSelect');
  const selectedYear = yearSelect ? yearSelect.value : 'all';
  
  let stats = { all: 0, normal: 0, warning: 0, expired: 0, pending: 0 };
  let html = ''; let matchCount = 0; 
  lists.forEach(function(item) {
    if (selectedYear !== 'all' && String(item.thaiYear).trim() !== String(selectedYear).trim()) return; 
    
    let badge = ''; let isEligibleForRenew = false; 
    let daysLeft = "-"; let itemStatus = 'normal';
    if (item.endDate && item.endDate !== '-') {
      let parts = item.endDate.split('/');
      let expDate = new Date(parts[2], parts[1] - 1, parts[0]);
      let today = new Date(); today.setHours(0,0,0,0);
      let timeDiff = expDate.getTime() - today.getTime();
      daysLeft = Math.ceil(timeDiff / (1000 * 3600 * 24));
    }

    if (item.licenseNo === '-') {
      itemStatus = 'pending';
      badge = `<span class="bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md font-bold text-[10px]">⏳ รออนุมัติ</span>`;
      isEligibleForRenew = false; 
    } else if (daysLeft <= 0) {
      itemStatus = 'expired';
      badge = `<span class="bg-rose-100 text-rose-700 px-2 py-0.5 rounded-md font-bold text-[10px]">🔴 หมดอายุคำขอ</span>`;
      isEligibleForRenew = true;  
    } else if (daysLeft <= 30) {
      itemStatus = 'warning';
      badge = `<span class="bg-orange-100 text-orange-700 px-2 py-0.5 rounded-md font-bold text-[10px]">🟡 ใกล้หมดอายุ (${daysLeft} วัน)</span>`;
      isEligibleForRenew = true;  
    } else {
      itemStatus = 'normal';
      badge = `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md font-medium text-[10px]">🟢 ปกติ (เหลือ ${daysLeft} วัน)</span>`;
      isEligibleForRenew = false; 
    }
    
    stats.all++;
    stats[itemStatus]++;
    
    if (typeof currentStatusFilter !== 'undefined' && currentStatusFilter !== 'all' && currentStatusFilter !== itemStatus) return;

    matchCount++;  

    let displayDate = item.importDate || item.startDate || "-";
    let renewButton = '';
    if (isEligibleForRenew && item.licenseNo !== '-') {
      renewButton = `<button type="button" onclick="handleRenewClick('${item.shopName}')" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-bold px-2 py-1 rounded-md text-[11px] cursor-pointer transition-all">🔄 ต่ออายุ</button>`;
    }

    html += `
      <tr class="hover:bg-slate-50/80 transition-all">
        <td class="p-2.5 text-center font-medium">${matchCount}</td>
        <td class="p-2.5">
          <div class="font-bold text-slate-800">${item.shopName} <span class="text-emerald-600 font-normal text-xs">(รอบปี ${item.thaiYear})</span></div>
          <div class="text-[10px] text-slate-400 font-medium italic mt-0.5">⏱️ บันทึกเมื่อ: ${displayDate}</div>
        </td>
        <td class="p-2.5 font-mono text-slate-600">${item.licenseNo}</td>
        <td class="p-2.5 text-slate-500">${item.startDate || '-'}</td>
        <td class="p-2.5 text-slate-500">${item.endDate || '-'}</td>
        <td class="p-2.5 text-center">${badge}</td>
        <td class="p-2.5 text-center space-x-1">
          <button type="button" onclick="selectShopForApproval('${item.shopName}', '${item.licenseNo === '-' ? '' : item.licenseNo}', '${item.memo || ''}', '${item.startDate || ''}', '${item.endDate || ''}')" class="bg-teal-50 text-teal-600 hover:bg-teal-100 font-bold px-2 py-1 rounded-md text-[11px] cursor-pointer transition-all">🖊️ ใบอนุญาต</button>
          <button type="button" onclick="handleEditClick('${item.shopName}')" class="bg-amber-50 text-amber-700 hover:bg-amber-100 font-bold px-2 py-1 rounded-md text-[11px] cursor-pointer transition-all">✏️ แก้ไข</button>
          ${renewButton}
        </td>
        <td class="p-2.5 text-center">
          <div class="flex flex-col space-y-1 items-center">
            <div class="flex space-x-1">
              <button type="button" onclick="printReport('${item.shopName}')" class="bg-slate-100 text-slate-700 hover:bg-slate-200 font-bold px-2 py-1 rounded-md text-[11px] cursor-pointer transition-all">🖨️ ประเมิน</button>
              <button type="button" onclick="exportToWord('${item.shopName}')" class="bg-emerald-600 text-white hover:bg-emerald-700 font-bold px-2 py-1 rounded-md text-[11px] cursor-pointer transition-all">Word</button>
            </div>
            <button type="button" onclick="exportLicenseToWord('${item.shopName}')" class="bg-amber-100 text-amber-700 hover:bg-amber-200 font-bold px-2 py-1 rounded-md text-[11px] cursor-pointer transition-all w-full text-center" ${item.licenseNo === '-' ? 'disabled style="opacity:0.5;cursor:not-allowed;" title="ต้องอนุมัติก่อน"' : ''}>📄 พิมพ์ใบอนุญาต</button>
          </div>
        </td>
      </tr>
    `;
  });
  
  if (html === '') tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">📊 ไม่พบข้อมูลคำขอใบอนุญาตประจำรอบปี พ.ศ. ที่เลือก</td></tr>`;
  else tbody.innerHTML = html;
  
  if (document.getElementById('count-all')) document.getElementById('count-all').innerText = stats.all;
  if (document.getElementById('count-normal')) document.getElementById('count-normal').innerText = stats.normal;
  if (document.getElementById('count-warning')) document.getElementById('count-warning').innerText = stats.warning;
  if (document.getElementById('count-expired')) document.getElementById('count-expired').innerText = stats.expired;
  if (document.getElementById('count-pending')) document.getElementById('count-pending').innerText = stats.pending;
}

function loadLicenseData() {
  const tbody = document.getElementById('licenseTableBody');
  tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400 animate-pulse">🔄 กำลังเชื่อมต่อฐานข้อมูลทะเบียน...</td></tr>`;
  
  google.script.run.withSuccessHandler(function(lists) {
    if (!lists || lists.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">📊 ยังไม่มีข้อมูลประวัติในขณะนี้</td></tr>`; return;
    }
    window.allLicenseData = lists;
    if (typeof initYearDropdownAndStats === 'function') { initYearDropdownAndStats(lists); }
    renderDashboardTable(lists);
  }).fetchInspectionAndLicenses();
}

function initYearDropdownAndStats(list) {
  window.allLicenseData = list; 
  let yearSelect = document.getElementById('statYearSelect') || document.getElementById('yearFilter');
  if (!yearSelect) return;
  let currentSelected = yearSelect.value || "all";
  yearSelect.innerHTML = '<option value="all">แสดงทั้งหมด</option>';
  let years = [];
  list.forEach(item => {
    if (item.thaiYear) {
      let year = String(item.thaiYear).trim();
      if (!years.includes(year)) { years.push(year); }
    }
  });
  years.sort((a, b) => b - a);
  years.forEach(year => {
    let option = document.createElement('option');
    option.value = year; option.textContent = "ปี พ.ศ. " + year;
    yearSelect.appendChild(option);
  });
  yearSelect.value = currentSelected;
  yearSelect.onchange = function() { calculateYearlyStats(); if(window.allLicenseData) renderDashboardTable(window.allLicenseData); };
  calculateYearlyStats();
}

let currentStatusFilter = 'all';

function filterStatus(status) {
  currentStatusFilter = status;
  const cards = ['all', 'normal', 'warning', 'expired', 'pending'];
  cards.forEach(c => {
    const el = document.getElementById('card-' + c);
    if (!el) return;
    if (c === status) {
      el.classList.remove('border-slate-200');
      el.classList.add('border-2');
      if(c==='all') el.classList.add('border-emerald-500');
      if(c==='normal') el.classList.add('border-emerald-500', 'bg-emerald-50');
      if(c==='warning') el.classList.add('border-orange-500', 'bg-orange-50');
      if(c==='expired') el.classList.add('border-rose-500', 'bg-rose-50');
      if(c==='pending') el.classList.add('border-amber-500', 'bg-amber-50');
    } else {
      el.classList.add('border-slate-200');
      el.classList.remove('border-2', 'border-emerald-500', 'border-orange-500', 'border-rose-500', 'border-amber-500', 'bg-emerald-50', 'bg-orange-50', 'bg-rose-50', 'bg-amber-50');
    }
  });
  
  if (window.allLicenseData) {
     renderDashboardTable(window.allLicenseData);
  }
}

function calculateYearlyStats() {
  let list = window.allLicenseData;
  if (!list) return;
  let yearSelect = document.getElementById('statYearSelect');
  let selectedYear = yearSelect.value;
  let count = 0;
  list.forEach(item => {
    if (selectedYear === 'all') { count++; } 
    else { if (item.thaiYear && String(item.thaiYear).trim() === String(selectedYear).trim()) { count++; } }
  });
  let statDisplay = document.getElementById('statYearCount');
  if (statDisplay) { statDisplay.innerText = count + " ราย"; }
}

function handleEditClick(shopName) {
  showCustomModal('⏳ รอสักครู่', 'กำลังดึงข้อมูลร้าน ' + shopName, '⏳');
  google.script.run.withSuccessHandler(function(res) {
    if (!res || !res.general) { showCustomModal('❌', 'ไม่พบข้อมูลของร้านนี้', 'X'); return; }
    
    currentEditingRowIndex = res.evaluation ? res.evaluation.rowIndex : null;
    if (document.getElementById('formRowIndex')) document.getElementById('formRowIndex').value = currentEditingRowIndex || "";
    
    let actionType = document.getElementById('formActionType');
    if (!actionType) {
      actionType = document.createElement('input'); actionType.type = 'hidden'; actionType.id = 'formActionType';
      const form = document.getElementById('assessmentForm'); if (form) form.appendChild(actionType);
    }
    actionType.value = "edit"; 
    
    document.getElementById('customModal').classList.add('hidden');
    changeMenuToggle('assessment');
    
    document.getElementById('shopName').value = res.general['ชื่อสถานประกอบกิจการ (ตัวเชื่อม)'] || res.general['ชื่อสถานประกอบกิจการ'] || '';
    document.getElementById('businessType').value = res.general['ประเภทกิจการ'] || '';
    syncBusinessTypeCheckboxes(res.general['ประเภทกิจการ'] || '');
    document.getElementById('ownerName').value = res.general['ชื่อผู้ดำเนินกิจการ'] || '';
    document.getElementById('phone_owner').value = res.general['โทรศัพท์ผู้ดำเนิน'] || '';
    document.getElementById('phone_shop').value = res.general['โทรศัพท์ร้าน'] || '';
    document.getElementById('address_no').value = res.general['ตั้งอยู่เลขที่'] || '';
    document.getElementById('moo').value = res.general['หมู่ที่'] || '';
    document.getElementById('street').value = res.general['ถนน'] || '';
    document.getElementById('animal_type').value = res.general['ชนิดสัตว์'] || res.general['ชนิดสัตว์ '] || '';
    document.getElementById('animal_count').value = res.general['จำนวนสัตว์'] || res.general['จำนวนสัตว์ '] || 0;
    document.getElementById('buildingStyle').value = res.general['ลักษณะอาคาร'] || '';
    document.getElementById('building_details').value = res.general['จำนวนชั้น/โรงเรือน/โกดัง'] || '';
    document.getElementById('machine_count').value = res.general['จำนวนเครื่องจักร (ตัว)'] || 0;
    document.getElementById('machine_power').value = res.general['รวมจำนวนแรงม้า'] || 0;
    document.getElementById('worker_male').value = res.general['พนักงานชาย (คน)'] || 0;
    document.getElementById('worker_female').value = res.general['พนักงานหญิง (คน)'] || 0;
    if(typeof calcTotalWorkers === 'function') calcTotalWorkers();
    
    if(document.getElementById('work_days')) document.getElementById('work_days').value = res.general['ระยะเวลาการทำงาน (วัน/สัปดาห์)'] || '6';

    function formatTimeInput(timeStr) {
      if (!timeStr) return "";
      let s = String(timeStr).trim();
      if (s.includes("T")) { s = s.split("T")[1]; }
      let parts = s.split(":");
      if (parts.length >= 2) return parts[0].padStart(2, '0') + ":" + parts[1].padStart(2, '0');
      return "";
    }

    if (document.getElementById('time_start')) document.getElementById('time_start').value = formatTimeInput(res.general['ตั้งแต่เวลา']) || "08:00";
    if (document.getElementById('time_end')) document.getElementById('time_end').value = formatTimeInput(res.general['ถึงเวลา']) || "17:00";
    
    let complainVal = res.general['ประวัติการถูกร้องเรียน'] || '';
    if (complainVal) {
      if (complainVal.includes('ไม่เคย')) { if(document.getElementById('comp_no')) document.getElementById('comp_no').checked = true; } 
      else if (complainVal.includes('เคย')) {
        if(document.getElementById('comp_yes')) document.getElementById('comp_yes').checked = true;
        let matchCount = complainVal.match(/\d+/);
        if (matchCount && document.getElementById('complaint_count')) document.getElementById('complaint_count').value = matchCount[0];
      }
      if(typeof toggleComplaintBox === 'function') toggleComplaintBox();
    }

    const issueIds = ['c_sound', 'c_dust', 'c_smell', 'c_chem', 'c_water', 'c_waste'];
    issueIds.forEach(id => { if(document.getElementById(id)) document.getElementById(id).checked = false; });
    let issueStr = String(res.general['ประเด็นที่ถูกร้องเรียน'] || '');
    if (issueStr) {
      if (issueStr.includes('เสียงดัง')) { if(document.getElementById('c_sound')) document.getElementById('c_sound').checked = true; }
      if (issueStr.includes('ฝุ่น') || issueStr.includes('ควัน')) { if(document.getElementById('c_dust')) document.getElementById('c_dust').checked = true; }
      if (issueStr.includes('กลิ่น')) { if(document.getElementById('c_smell')) document.getElementById('c_smell').checked = true; }
      if (issueStr.includes('สารเคมี')) { if(document.getElementById('c_chem')) document.getElementById('c_chem').checked = true; }
      if (issueStr.includes('น้ำเสีย')) { if(document.getElementById('c_water')) document.getElementById('c_water').checked = true; }
      if (issueStr.includes('ขยะ') || issueStr.includes('สิ่งปฏิกูล')) { if(document.getElementById('c_waste')) document.getElementById('c_waste').checked = true; }
    }
    
    const tbody = document.getElementById('materialsTableBody'); 
    if (tbody) {
      tbody.innerHTML = ''; 
      let rawMats = res.general['วัตถุดิบและสารเคมี'] || "";
      if (rawMats && rawMats !== 'ไม่มีการระบุวัตถุดิบและสารเคมี' && rawMats !== '-') {
        let lines = rawMats.split('\n');
        lines.forEach((line, idx) => {
          if(!line.trim()) return;
          let cleanLine = line.replace(/^\d+\.\s*/, ''); 
          let matName = cleanLine; let matQty = "";
          if (cleanLine.includes('(') && cleanLine.endsWith(')')) {
            let startIdx = cleanLine.lastIndexOf('(');
            matName = cleanLine.substring(0, startIdx).trim();
            matQty = cleanLine.substring(startIdx + 1, cleanLine.length - 1).trim();
          }
          const tr = document.createElement('tr'); tr.className = "material-row";
          tr.innerHTML = `
            <td class="p-2 text-center text-slate-400 font-bold row-index">${idx + 1}</td>
            <td class="p-1"><input type="text" class="table-input mat-name" value="${matName}"></td>
            <td class="p-1"><input type="text" class="table-input mat-qty" value="${matQty}"></td>
            <td class="p-1 text-center"><button type="button" onclick="this.closest('tr').remove(); reindexMaterials();" class="text-rose-500 font-bold hover:text-rose-700 cursor-pointer">✕</button></td>
          `;
          tbody.appendChild(tr);
        });
      }
    }
    
    // 🎯 ดึงข้อมูลคำตอบแบบไดนามิก
    let questionCount = window.loadedQuestions ? window.loadedQuestions.length : 29;
    if (questionCount === 0) questionCount = 29;
    for (let i = 1; i <= questionCount; i++) {
      let rVal = res.evaluation['r' + i];
      let radios = document.getElementsByName('r' + i); 
      for(let r=0; r<radios.length; r++) { if(radios[r].value === rVal) { radios[r].checked = true; break; } }
      if(document.getElementById('f' + i)) document.getElementById('f' + i).value = res.evaluation['f' + i] || '';
      if(document.getElementById('c' + i)) document.getElementById('c' + i).value = res.evaluation['c' + i] || '';
    }
    
    if(document.getElementById('comment_notes')) document.getElementById('comment_notes').value = res.evaluation['ข้อเสนอแนะเพิ่มเติม'] || '';
    if(document.getElementById('summary_result')) document.getElementById('summary_result').value = res.evaluation['สรุปผลการตรวจ'] || 'ผ่านเกณฑ์การประเมินโครงสร้างพื้นฐาน';
    if(document.getElementById('inspector_name')) document.getElementById('inspector_name').value = res.evaluation['ชื่อผู้ตรวจ'] || '';
    if(document.getElementById('inspector_position')) document.getElementById('inspector_position').value = res.evaluation['ตำแหน่งผู้ตรวจ'] || '';
    
    const btn = document.getElementById('submitBtn');
    if (btn) btn.innerText = "💾 บันทึกการเปลี่ยนแปลง (เขียนทับแถวเดิม)";
    let dateLabel = document.getElementById('lastUpdateDisplay');
    if (dateLabel && res.general) {
      let keys = Object.keys(res.general);
      let timestampKey = keys.find(k => k.includes("Timestamp") || k.includes("ประทับเวลา"));
      dateLabel.innerText = "อัปเดตล่าสุด: " + (timestampKey ? res.general[timestampKey] : res.general[keys[0]]);
    }
    window.scrollTo(0, 0);
  }).getCompleteReportData(shopName);
}

function toDateInputValue(value) {
  if (!value || value === '-') return '';
  let s = String(value).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return '';
}

function submitForm(e) {
  if (e && e.preventDefault) e.preventDefault();
  
  let payload = {};
  payload['rowIndex'] = currentEditingRowIndex; 
  
  // 🎯 กวาดข้อมูลคำตอบแบบไดนามิก
  let questionCount = window.loadedQuestions ? window.loadedQuestions.length : 29;
  if (questionCount === 0) questionCount = 29;
  let totalArr = Array.from({length: questionCount}, (_, i) => i + 1);
  totalArr.forEach(num => {
    let numStr = num.toString();
    let rad = document.querySelector(`input[name="r${numStr}"]:checked`);
    payload['r' + numStr] = rad ? rad.value : 'ไม่เกี่ยวข้อง';
    let txtFact = document.querySelector(`input[name="f${numStr}"]`);
    payload['f' + numStr] = txtFact ? txtFact.value.trim() : "";
    let txtAdv = document.querySelector(`input[name="c${numStr}"]`);
    payload['c' + numStr] = txtAdv ? txtAdv.value.trim() : "";
  });

  const btn = document.getElementById('submitBtn');
  if (btn) { btn.disabled = true; btn.innerText = "⏳ กำลังส่งข้อมูลขึ้นระบบคลาวด์..."; }
  
  const formElements = document.getElementById('assessmentForm').querySelectorAll('input, select, textarea');
  formElements.forEach(i => {
    if (i.name) { if (i.type === 'radio' && !i.checked) return; payload[i.name] = i.value; }
  });
  
  let shopNameInput = document.getElementById('shopName');
  payload['shopName'] = shopNameInput ? shopNameInput.value.replace('🔍', '').trim() : 'ร้านค้าไม่ระบุชื่อ';
  
  let workerTotalInput = document.getElementById('worker_total'); payload['worker_total'] = workerTotalInput ? workerTotalInput.value : "0";
  let commentNotesInput = document.getElementById('comment_notes'); payload['comment_notes'] = commentNotesInput ? commentNotesInput.value.trim() : "";

  let mats = [];
  document.querySelectorAll('.material-row').forEach((row, i) => {
    let nameInput = row.querySelector('.mat-name'); let qtyInput = row.querySelector('.mat-qty');
    let nameVal = nameInput ? nameInput.value.trim() : ''; let qtyVal = qtyInput ? qtyInput.value.trim() : '';
    if (nameVal) mats.push(`${i+1}. ${nameVal} (${qtyVal || 'ไม่ระบุปริมาณ'})`);
  });
  payload['materials'] = mats.length > 0 ? mats.join('\n') : 'ไม่มีการระบุวัตถุดิบและสารเคมี';

  let compNo = document.getElementById('comp_no'); let compYes = document.getElementById('comp_yes'); let compCount = document.getElementById('complaint_count');
  payload['complaint_no'] = compNo && compNo.checked ? "✓" : "";
  payload['complaint_yes'] = compYes && compYes.checked ? "✓" : "";
  payload['complaint_count'] = compCount ? compCount.value : "0";
  
  let issues = [];
  const checks = ['c_sound', 'c_dust', 'c_smell', 'c_chem', 'c_water', 'c_waste'];
  checks.forEach(id => {
    let el = document.getElementById(id);
    if (el && el.checked) { let labelText = el.nextElementSibling ? el.nextElementSibling.innerText : id; issues.push(labelText); }
  });
  payload['complaint_issues'] = issues.length > 0 ? issues.join(', ') : 'ไม่มีข้อร้องเรียน';

  let summaryResultSelect = document.getElementById('summary_result'); payload['summary_result'] = summaryResultSelect ? summaryResultSelect.value : "ผ่านเกณฑ์มาตรฐาน";
  let inspectorNameInput = document.getElementById('inspector_name'); payload['inspector_name'] = inspectorNameInput ? inspectorNameInput.value : "";
  let inspectorPositionInput = document.getElementById('inspector_position'); payload['inspector_position'] = inspectorPositionInput ? inspectorPositionInput.value : "";

  payload['currentUserRealName'] = currentUser.realName || (inspectorNameInput ? inspectorNameInput.value : "");
  payload['currentUserPosition'] = currentUser.position || (inspectorPositionInput ? inspectorPositionInput.value : "");

  google.script.run.withSuccessHandler((msg) => {
    showCustomModal('🎉 บันทึกข้อมูลสำเร็จ', `อัปโหลดผลประเมินเรียบร้อยแล้วครับ`, '✅');
    document.getElementById('assessmentForm').reset();
    let matTbody = document.getElementById('materialsTableBody'); if (matTbody) matTbody.innerHTML = '';
    let complaintBox = document.getElementById('complaintDetailBox'); if (complaintBox) complaintBox.className = 'hidden';
    
    currentEditingRowIndex = null; window.scrollTo(0, 0);
    if (btn) { btn.disabled = false; btn.innerText = "💾 บันทึกและอัปโหลดขึ้นระบบคลาวด์"; }
  }).withFailureHandler((err) => {
    showCustomModal('❌ บันทึกไม่สำเร็จ', "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์คลาวด์: " + err, '❌');
    if (btn) { btn.disabled = false; btn.innerText = "💾 บันทึกและอัปโหลดขึ้นระบบคลาวด์"; }
  }).saveEHWAData(payload);
}

      </table>
    </body>

    let bom = "\uFEFF";
    let blob = new Blob([bom + htmlContent], { type: 'application/msword;charset=utf-8;' });
    let link = document.createElement("a"); link.href = URL.createObjectURL(blob);
    let safeName = shopName.replace(/[\\/:"*?<>|]/g, '');
    link.setAttribute("download", "แบบพิมพ์รายงาน_" + safeName.trim() + ".doc");
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
  }).getCompleteReportData(shopName);
}

function togglePasswordVisibility() {
  const passwordInput = document.getElementById('login_password');
  const eyeIcon = document.getElementById('eye-icon');
  
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    passwordInput.classList.remove('font-mono', 'tracking-widest');
    passwordInput.classList.add('font-medium');
    eyeIcon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
    `;
  } else {
    passwordInput.type = 'password';
    passwordInput.classList.add('font-mono', 'tracking-widest');
    passwordInput.classList.remove('font-medium');
    eyeIcon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    `;
  }
}

function exportLicenseToWord(shopName) {
  if (!shopName) return;
  google.script.run.withSuccessHandler(function(trueUrl) {
    let reportUrl = trueUrl + "?view=license&shopName=" + encodeURIComponent(shopName);
    window.open(reportUrl, '_blank');
  }).getWebAppUrl(); 
}
